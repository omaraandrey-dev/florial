name: Deploy Florial Sanity Studio

on:
  push:
    branches: [main]
    paths:
      - "studio/**"
      - ".github/workflows/deploy-sanity-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: florial-sanity-studio-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate and build both Studio workspaces
        run: npm run build

      - name: Deploy irrigation and services schema from GitHub
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: npx sanity@latest schemas deploy --workspace florial-admin --verbose

      - name: Deploy plants schema from GitHub
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: npx sanity@latest schemas deploy --workspace plants --verbose

      # The existing Sanity Studio applications do not expose their hosted hostname
      # through the available project API. Do not run interactive deploy/undeploy commands
      # here: the CLI may exit 0 without deploying when it reaches a hostname prompt.
      # Keep all registered apps intact until the canonical hosted URL is verified.
