name: Deploy Florial Sanity Studio

on:
  push:
    branches: [main]
    paths:
      - "studio/**"
      - ".github/workflows/deploy-sanity-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: florial-sanity-studio-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate and build both Studio workspaces
        run: npm run build

      # deployment.appId in sanity.cli.ts targets the canonical existing app.
      # Deploy it successfully before removing duplicate hosted apps. A failure
      # here stops the job, preserving the old apps as a rollback path.
      - name: Deploy canonical multi-workspace Studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: npx sanity@latest deploy --yes --schema-required

      # These are the two previously verified duplicate app IDs. Undeploying
      # hosted apps does not delete datasets or Content Lake documents.
      # Keep these steps after successful canonical deployment only.
      - name: Remove duplicate irrigation Studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: npx sanity@latest undeploy hviai8hravffsm8kiqzze6sb --yes

      - name: Remove duplicate plants Studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: npx sanity@latest undeploy g1957r1p52277jhtc60dlgi5 --yes
