name: Deploy Florial Sanity Studio

on:
  push:
    branches: [main]
    paths:
      - "studio/**"
      - ".github/workflows/deploy-sanity-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: florial-sanity-studio-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate and build both Studio workspaces
        run: npm run build

      # CLI v6 refuses the current React 18 dependencies. CLI v4 supports
      # React 18 and is used to deploy the existing app ID without a major
      # dependency migration. If deployment fails, cleanup steps are skipped.
      - name: Deploy canonical multi-workspace Studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: npx sanity@4 deploy --yes --schema-required

      # Remove only verified duplicate app IDs after canonical deploy succeeds.
      # Hosted Studio removal does not delete datasets or Content Lake documents.
      - name: Remove duplicate irrigation Studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: npx sanity@4 undeploy hviai8hravffsm8kiqzze6sb --yes

      - name: Remove duplicate plants Studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: npx sanity@4 undeploy g1957r1p52277jhtc60dlgi5 --yes
