name: Deploy Florial Sanity Studio

on:
  push:
    branches: [main]
    paths:
      - "studio/**"
      - ".github/workflows/deploy-sanity-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: florial-sanity-studio-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate and build both Studio workspaces
        run: npm run build

      # Use JSON mode in CI so interactive app selection cannot leave the
      # workflow green without a completed deployment.
      - name: Deploy canonical multi-workspace Studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          CI: "true"
        run: npx sanity@4 deploy --url florial-admin-bg --yes --schema-required --json

      # Duplicate app registrations are intentionally not removed by this
      # workflow: CLI undeploy attempts against their app IDs reported
      # "Nothing to undeploy" and did not remove dashboard registrations.
      # Remove those exact entries through Sanity Manage after verifying the
      # canonical hosted Studio and both workspaces.
