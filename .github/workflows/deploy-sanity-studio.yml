name: Deploy Florial Sanity Studio

on:
  push:
    branches: [main]
    paths:
      - "studio/**"
      - ".github/workflows/deploy-sanity-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: florial-sanity-studio-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate and build both Studio workspaces
        run: npm run build

      - name: Deploy irrigation and services schema from GitHub
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: npx sanity schemas deploy --workspace florial-admin --verbose

      - name: Deploy plants schema from GitHub
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: npx sanity schemas deploy --workspace plants --verbose

      - name: Require the canonical existing Studio hostname
        env:
          SANITY_STUDIO_HOST: ${{ vars.SANITY_STUDIO_HOST }}
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: |
          if [ -z "$SANITY_AUTH_TOKEN" ]; then
            echo "::error::Missing SANITY_AUTH_TOKEN repository secret."
            exit 1
          fi
          if [ -z "$SANITY_STUDIO_HOST" ]; then
            echo "::error::Set the repository Actions variable SANITY_STUDIO_HOST to the existing canonical Studio hostname (without https://), then rerun this workflow. Do not guess the hostname."
            exit 1
          fi

      - name: Deploy the existing canonical Florial Studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_STUDIO_HOST: ${{ vars.SANITY_STUDIO_HOST }}
        run: npx sanity deploy --url "$SANITY_STUDIO_HOST" --yes --schema-required

      - name: Remove the obsolete duplicate catalog Studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: npx sanity undeploy hviai8hravffsm8kiqzze6sb --yes
