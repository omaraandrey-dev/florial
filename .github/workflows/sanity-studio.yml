name: Sanity Studio — validate and deploy

on:
  push:
    branches: [main]
    paths:
      - "studio/**"
      - ".github/workflows/sanity-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: florial-sanity-studio
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate and build both Studio workspaces
        run: npm run build
      - name: Deploy existing Florial Studio
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: |
          if [ -z "$SANITY_AUTH_TOKEN" ]; then
            echo "::error::Add SANITY_AUTH_TOKEN in GitHub repository Actions secrets. This workflow intentionally fails rather than creating a new Studio or deploying to an unknown app."
            exit 1
          fi
          npx sanity deploy --no-prompt
