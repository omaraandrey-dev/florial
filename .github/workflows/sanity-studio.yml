name: Sanity Studio — validate and deploy

on:
  push:
    branches: [main]
    paths:
      - "studio/**"
      - ".github/workflows/sanity-studio.yml"
  pull_request:
    branches: [main]
    paths:
      - "studio/**"
      - ".github/workflows/sanity-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: florial-sanity-studio-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build both Studio workspaces
        run: npm run build

  deploy:
    name: Deploy existing Florial Studio
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Verify Sanity deployment token
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: |
          if [ -z "$SANITY_AUTH_TOKEN" ]; then
            echo "::error::GitHub Actions secret SANITY_AUTH_TOKEN is not configured."
            exit 1
          fi
      - name: Deploy both workspaces to the existing Sanity Studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: npx sanity deploy --yes
