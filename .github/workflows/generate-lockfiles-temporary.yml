name: Generate Florial npm lockfiles

on:
  push:
    branches:
      - chore/bootstrap-florial-lockfiles-2026-11-07

permissions:
  contents: write

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate root lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Generate Sanity Studio lockfile
        working-directory: studio
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json studio/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles are already current."
          else
            git commit -m "chore: add reproducible npm lockfiles [skip ci]"
            git push
          fi
