name: Florial D1 migration validation

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/migrations/**"
      - "tests/*migration*.test.py"
  push:
    branches: [main]
    paths:
      - "docs/migrations/**"
      - "tests/*migration*.test.py"
      - ".github/workflows/validate-d1-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: florial-d1-migration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate additive plant audit migration
        run: python3 tests/manager-product-audit-migration.test.py
      - name: Validate contract withdrawals migration
        run: python3 tests/contract-withdrawals-migration.test.py
      - name: Validate Manager password reset migration
        run: python3 tests/manager-password-reset-migration.test.py
      - name: Validate legacy submission permission retirement migration
        run: python3 tests/manager-submission-permissions-migration.test.py
      - name: Validate Manager Web Push subscriptions migration
        run: python3 tests/manager-push-migration.test.py
