name: Temporary Sentry PR validation

on:
  push:
    branches:
      - feat/sentry-react-sdk

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install website dependencies
        run: npm ci
      - name: Type-check application and Pages Functions
        run: npm run typecheck
      - name: Lint website
        run: npm run lint
      - name: Test website utilities
        run: npm test
      - name: Build website
        run: npm run build
      - name: Install Studio dependencies
        working-directory: studio
        run: npm ci
      - name: Type-check Studio
        working-directory: studio
        run: npm run typecheck
      - name: Build Studio
        working-directory: studio
        run: npm run build
