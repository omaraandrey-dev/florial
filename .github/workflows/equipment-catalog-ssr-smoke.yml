name: Equipment catalog SSR — all categories

on:
  push:
    branches:
      - feat/ssr-equipment-catalog-v2
      - main
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
    paths:
      - 'functions/_middleware.ts'
      - 'functions/_lib/equipmentCategoryPageHtml.mjs'
      - 'functions/_lib/equipmentCategoryPageHtml.d.mts'
      - 'tests/equipment-category-page-ssr.test.mjs'
      - 'tests/equipment-category-server-rendering.test.mjs'
      - 'scripts/smoke-equipment-catalog-ssr.mjs'
      - '.github/workflows/equipment-catalog-ssr-smoke.yml'

permissions:
  contents: read

jobs:
  raw-http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check all published equipment categories in BG/RU/EN using raw HTTP HTML
        env:
          BASE_URL: ${{ github.ref_name == 'main' && 'https://florial-bg.com' || 'https://feat-ssr-equipment-catalog-v.florial.pages.dev' }}
        run: node scripts/smoke-equipment-catalog-ssr.mjs
