name: Plant catalogue SSR smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "functions/_middleware.ts"
      - "functions/_lib/plantCategoryHtml.mjs"
      - "functions/_lib/plantProductHtml.mjs"
      - "tests/plant-*-server-rendering.test.mjs"
      - "scripts/smoke-plant-ssr.mjs"
      - ".github/workflows/plant-catalog-ssr-smoke.yml"

permissions:
  contents: read
  checks: read

jobs:
  plant-ssr-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for the exact Cloudflare Preview deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            checks="$(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GITHUB_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs")"
            status="$(printf '%s' "$checks" | jq -r '[.check_runs[] | select(.name == "Cloudflare Pages")] | last | .status // empty')"
            conclusion="$(printf '%s' "$checks" | jq -r '[.check_runs[] | select(.name == "Cloudflare Pages")] | last | .conclusion // empty')"
            details_url="$(printf '%s' "$checks" | jq -r '[.check_runs[] | select(.name == "Cloudflare Pages")] | last | .details_url // empty')"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then echo "Cloudflare Preview failed: ${details_url}"; exit 1; fi
              deployment_id="$(printf '%s' "$details_url" | sed -nE 's#.*pages/view/florial/([0-9a-f-]+).*#\1#p')"
              if [ -z "$deployment_id" ]; then echo "Could not extract Preview deployment ID from ${details_url}"; exit 1; fi
              deployment_short_id="${deployment_id:0:8}"
              echo "BASE_URL=https://${deployment_short_id}.florial.pages.dev" >> "$GITHUB_ENV"
              echo "Using exact successful Preview deployment: https://${deployment_short_id}.florial.pages.dev"
              exit 0
            fi
            echo "Waiting for Cloudflare Pages check (attempt ${attempt}/60; status=${status:-pending})"
            sleep 10
          done
          echo "Timed out waiting for Cloudflare Preview"
          exit 1

      - name: Smoke all published plant products and categories
        run: node scripts/smoke-plant-ssr.mjs
