name: Blog index SSR Preview and Production smoke

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  raw-http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_URL: ${{ github.event_name == 'pull_request' && '' || 'https://florial-bg.com' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Wait for exact Cloudflare Pages Preview and resolve its URL
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            checks="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs")"
            status="$(printf '%s' "${checks}" | jq -r '[.check_runs[] | select(.name == "Cloudflare Pages")] | last | .status // empty')"
            conclusion="$(printf '%s' "${checks}" | jq -r '[.check_runs[] | select(.name == "Cloudflare Pages")] | last | .conclusion // empty')"
            details_url="$(printf '%s' "${checks}" | jq -r '[.check_runs[] | select(.name == "Cloudflare Pages")] | last | .details_url // empty')"
            if [ "${status}" = "completed" ]; then
              if [ "${conclusion}" != "success" ]; then echo "Cloudflare Pages deployment failed: ${details_url}"; exit 1; fi
              deployment_id="$(printf '%s' "${details_url}" | sed -nE 's#.*pages/view/florial/([0-9a-f-]+).*#\1#p')"
              if [ -z "${deployment_id}" ]; then echo "Could not extract Preview deployment ID from ${details_url}"; exit 1; fi
              deployment_short_id="${deployment_id:0:8}"
              echo "PREVIEW_URL=https://${deployment_short_id}.florial.pages.dev" >> "${GITHUB_ENV}"
              echo "Resolved exact Preview deployment https://${deployment_short_id}.florial.pages.dev"
              exit 0
            fi
            echo "Waiting for Cloudflare Pages Preview (attempt ${attempt}/60; status=${status:-pending})"
            sleep 10
          done
          echo "Timed out waiting for Cloudflare Pages Preview for ${TARGET_SHA}"
          exit 1
      - name: Verify blog index initial HTML without JavaScript
        run: node scripts/smoke-blog-index-ssr.mjs
