name: Blog index SSR Preview and Production smoke

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  raw-http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_URL: ${{ github.event_name == 'push' && 'https://florial-bg.com' || 'https://feat-ssr-blog-index-v1.florial.pages.dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Wait for the exact Cloudflare Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          for attempt in $(seq 1 36); do
            checks=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA/check-runs")
            conclusion=$(printf '%s' "$checks" | jq -r '[.check_runs[] | select(.name == "Cloudflare Pages") | .conclusion] | last // empty')
            if [ "$conclusion" = "success" ]; then
              echo "Cloudflare Pages deployment for $TARGET_SHA is successful."
              exit 0
            fi
            if [ "$conclusion" = "failure" ] || [ "$conclusion" = "cancelled" ]; then
              echo "$checks" | jq -r '.check_runs[] | select(.name == "Cloudflare Pages") | .output.summary'
              exit 1
            fi
            echo "Waiting for Cloudflare Pages deployment ($attempt/36)..."
            sleep 10
          done
          echo "Timed out waiting for Cloudflare Pages deployment for $TARGET_SHA."
          exit 1
      - name: Verify blog index initial HTML without JavaScript
        run: node scripts/smoke-blog-index-ssr.mjs
