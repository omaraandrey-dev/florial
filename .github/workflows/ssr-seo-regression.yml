name: Florial full SSR and SEO regression

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "functions/_middleware.ts"
      - "functions/_lib/**"
      - "src/content/**"
      - "src/pages/**"
      - "scripts/smoke-*-ssr.mjs"
      - "scripts/smoke-ssr-regression.mjs"
      - "scripts/lib/cloudflare-email.mjs"
      - "tests/**ssr*.test.mjs"
      - ".github/workflows/ssr-seo-regression.yml"
  push:
    branches: [main]
    paths:
      - "functions/_middleware.ts"
      - "functions/_lib/**"
      - "src/content/**"
      - "src/pages/**"
      - "scripts/smoke-*-ssr.mjs"
      - "scripts/lib/cloudflare-email.mjs"
      - "tests/**ssr*.test.mjs"
      - ".github/workflows/ssr-seo-regression.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: Exact Florial Preview URL or Production URL to test
        required: true
        default: https://florial-bg.com
        type: string

permissions:
  contents: read
  checks: read

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_URL: ${{ inputs.base_url || (github.event_name == 'push' && 'https://florial-bg.com') || '' }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for exact Cloudflare Pages deployment
        if: github.event_name != 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            checks="$(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GITHUB_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs")"
            status="$(printf '%s' "${checks}" | jq -r '[.check_runs[] | select(.name == "Cloudflare Pages")] | last | .status // empty')"
            conclusion="$(printf '%s' "${checks}" | jq -r '[.check_runs[] | select(.name == "Cloudflare Pages")] | last | .conclusion // empty')"
            details_url="$(printf '%s' "${checks}" | jq -r '[.check_runs[] | select(.name == "Cloudflare Pages")] | last | .details_url // empty')"
            if [ "${status}" = "completed" ]; then
              if [ "${conclusion}" != "success" ]; then echo "Cloudflare Pages deployment failed: ${details_url}"; exit 1; fi
              if [ "${EVENT_NAME}" = "pull_request" ]; then
                deployment_id="$(printf '%s' "${details_url}" | sed -nE 's#.*pages/view/florial/([0-9a-f-]+).*#\1#p')"
                if [ -z "${deployment_id}" ]; then echo "Could not extract Preview deployment ID from ${details_url}"; exit 1; fi
                deployment_short_id="${deployment_id:0:8}"
                echo "BASE_URL=https://${deployment_short_id}.florial.pages.dev" >> "${GITHUB_ENV}"
                echo "Resolved exact Preview deployment https://${deployment_short_id}.florial.pages.dev"
              else
                echo "Using Production after successful Pages deployment: ${BASE_URL}"
              fi
              exit 0
            fi
            echo "Waiting for Cloudflare Pages check (attempt ${attempt}/60; status=${status:-pending})"
            sleep 10
          done
          echo "Timed out waiting for Cloudflare Pages deployment for ${TARGET_SHA}"
          exit 1
      - name: Run complete raw first-response SSR/SEO regression
        run: node scripts/smoke-ssr-regression.mjs
