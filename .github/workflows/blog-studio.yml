name: Blog and Studio validation

on:
  push:
    branches:
      - feature/florial-blog
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install website dependencies
        run: npm install
      - name: Lint website
        run: npm run lint
      - name: Build website
        run: npm run build
      - name: Check migration script syntax
        run: |
          node --check scripts/blog-migration/prepare-from-source.mjs
          node --check scripts/blog-migration/import-blog-posts.mjs
      - name: Install Studio dependencies
        working-directory: studio
        run: npm install
      - name: Build Studio
        working-directory: studio
        run: npm run build

  deploy-existing-studio:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/feature/florial-blog') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/florial-blog')
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Studio dependencies
        working-directory: studio
        run: npm install
      - name: Deploy schema to existing Florial workspaces
        working-directory: studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: |
          test -n "$SANITY_AUTH_TOKEN" || (echo "Missing GitHub Actions secret SANITY_AUTH_TOKEN; Studio deployment was not attempted." && exit 1)
          npx sanity schema deploy --workspace florial-admin
          npx sanity schema deploy --workspace plants
      - name: Deploy existing hosted Studio app
        working-directory: studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: npx sanity deploy --yes
      - name: Install website dependencies for the importer
        run: npm install
      - name: Prepare article bodies and upload source images
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: node scripts/blog-migration/prepare-from-source.mjs
      - name: Validate all prepared articles before writing documents
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: node scripts/blog-migration/import-blog-posts.mjs
      - name: Import and publish blog articles
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: node scripts/blog-migration/import-blog-posts.mjs --write --confirm-production-write --publish
