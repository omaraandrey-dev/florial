name: Blog and Studio validation

on:
  push:
    branches:
      - feature/florial-blog
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install website dependencies
        run: npm install
      - name: Lint website
        run: npm run lint
      - name: Build website
        run: npm run build
      - name: Check migration script syntax
        run: |
          node --check scripts/blog-migration/prepare-from-source.mjs
          node --check scripts/blog-migration/import-blog-posts.mjs
      - name: Install Studio dependencies
        working-directory: studio
        run: npm install
      - name: Build Studio
        working-directory: studio
        run: npm run build

# Deployment and production content writes are handled only by deploy-sanity-studio.yml.
