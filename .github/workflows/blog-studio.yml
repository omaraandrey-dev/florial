name: Blog and Studio validation

on:
  push:
    branches:
      - main
      - feature/florial-blog
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: florial-blog-studio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install website dependencies
        run: npm ci
      - name: Type-check application and Pages Functions
        run: npm run typecheck
      - name: Lint website
        run: npm run lint
      - name: Test website utilities
        run: npm test
      - name: Build website
        run: npm run build
      - name: Check migration script syntax
        run: |
          node --check scripts/blog-migration/prepare-from-source.mjs
          node --check scripts/blog-migration/import-blog-posts.mjs
          node --check scripts/migrate-descriptions-to-portable-text.mjs
      - name: Run read-only description migration dry-run
        run: node scripts/migrate-descriptions-to-portable-text.mjs
      - name: Install Studio dependencies
        working-directory: studio
        run: npm ci
      - name: Type-check Studio
        working-directory: studio
        run: npm run typecheck
      - name: Build Studio
        working-directory: studio
        run: npm run build

# Deployment and production content writes are handled only by deploy-sanity-studio.yml.
