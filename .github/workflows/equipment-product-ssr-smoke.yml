name: Equipment product SSR validation and raw HTTP smoke

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install website dependencies
        run: npm ci
      - name: Type-check application and Pages Functions
        run: npm run typecheck
      - name: Lint website
        run: npm run lint
      - name: Test website utilities and SSR renderers
        run: npm test
      - name: Build website and Pages Functions
        run: npm run build

  raw-http-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_URL: ${{ github.event_name == 'push' && 'https://florial-bg.com' || 'https://feat-ssr-equipment-product-p.florial.pages.dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Wait for exact Cloudflare Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          for attempt in $(seq 1 36); do
            checks=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA/check-runs")
            conclusion=$(printf '%s' "$checks" | jq -r '[.check_runs[] | select(.name == "Cloudflare Pages") | .conclusion] | last // empty')
            if [ "$conclusion" = "success" ]; then
              echo "Cloudflare Pages deployment for $TARGET_SHA is successful."
              exit 0
            fi
            if [ "$conclusion" = "failure" ] || [ "$conclusion" = "cancelled" ]; then
              echo "$checks" | jq -r '.check_runs[] | select(.name == "Cloudflare Pages") | .output.summary'
              exit 1
            fi
            echo "Waiting for Cloudflare Pages deployment ($attempt/36)..."
            sleep 10
          done
          echo "Timed out waiting for Cloudflare Pages deployment for $TARGET_SHA."
          exit 1
      - name: Verify all active published equipment product pages without JavaScript
        run: node scripts/smoke-equipment-product-ssr.mjs
