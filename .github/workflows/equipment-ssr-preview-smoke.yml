name: Equipment SSR Preview smoke

on:
  push:
    branches:
      - feat/seo-equipment-category-ssr-v1
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'functions/_middleware.ts'
      - 'functions/_lib/plantCategoryHtml.mjs'
      - 'functions/_lib/plantCategoryHtml.d.mts'
      - 'tests/equipment-category-server-rendering.test.mjs'
      - '.github/workflows/equipment-ssr-preview-smoke.yml'

permissions:
  contents: read
  checks: read

jobs:
  raw-http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://florial-bg.com
    steps:
      - name: Resolve the exact Cloudflare Pages Preview URL
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            checks="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs")"
            status="$(printf '%s' "${checks}" | jq -r '[.check_runs[] | select(.name == "Cloudflare Pages")] | last | .status // empty')"
            conclusion="$(printf '%s' "${checks}" | jq -r '[.check_runs[] | select(.name == "Cloudflare Pages")] | last | .conclusion // empty')"
            details_url="$(printf '%s' "${checks}" | jq -r '[.check_runs[] | select(.name == "Cloudflare Pages")] | last | .details_url // empty')"
            if [ "${status}" = "completed" ]; then
              if [ "${conclusion}" != "success" ]; then echo "Cloudflare Pages deployment failed: ${details_url}"; exit 1; fi
              deployment_id="$(printf '%s' "${details_url}" | sed -nE 's#.*pages/view/florial/([0-9a-f-]+).*#\1#p')"
              if [ -z "${deployment_id}" ]; then echo "Could not extract Preview deployment ID from ${details_url}"; exit 1; fi
              deployment_short_id="${deployment_id:0:8}"
              echo "BASE_URL=https://${deployment_short_id}.florial.pages.dev" >> "${GITHUB_ENV}"
              echo "Resolved exact Preview deployment https://${deployment_short_id}.florial.pages.dev"
              exit 0
            fi
            echo "Waiting for Cloudflare Pages Preview (attempt ${attempt}/60; status=${status:-pending})"
            sleep 10
          done
          echo "Timed out waiting for Cloudflare Pages Preview for ${TARGET_SHA}"
          exit 1
      - name: Verify initial HTTP HTML without executing JavaScript
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const base = process.env.BASE_URL;
          const routes = [
            { lang: 'bg', url: '/category/vsichko-za-polivane' },
            { lang: 'ru', url: '/category/vsichko-za-polivane?lang=ru' },
            { lang: 'en', url: '/category/vsichko-za-polivane?lang=en' },
          ];

          async function fetchHtml(route) {
            let lastError;
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                const response = await fetch(new URL(route.url, base), {
                  headers: { accept: 'text/html' },
                  signal: AbortSignal.timeout(20000),
                  redirect: 'follow',
                });
                const html = await response.text();
                if (response.status === 200 && html.includes('data-florial-server-catalogue="equipment"')) {
                  return { response, html };
                }
                lastError = new Error(`attempt ${attempt}: HTTP ${response.status}; server catalogue marker missing`);
              } catch (error) {
                lastError = error;
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            throw lastError || new Error('Preview did not return initial equipment HTML');
          }

          for (const route of routes) {
            const { response, html } = await fetchHtml(route);
            assert.match(response.headers.get('content-type') || '', /text\/html/i);
            assert.match(html, /name="robots"[^>]*content="index, follow"/i);

            const sectionMatch = html.match(/<section\b[^>]*data-florial-server-catalogue="equipment"[^>]*>([\s\S]*?)<\/section>/i);
            assert.ok(sectionMatch, `${route.lang}: equipment SSR section must be in the first HTTP response`);
            const section = sectionMatch[1];
            const productLinks = [...section.matchAll(/<a\b[^>]*href="([^"]*\/product\/[^"]+)"[^>]*>/gi)].map((match) => match[1]);
            assert.equal(productLinks.length, 20, `${route.lang}: expected 20 server-rendered product links`);

            const collectionScript = html.match(/<script\b[^>]*data-florial-jsonld="collection-page"[^>]*>([\s\S]*?)<\/script>/i);
            assert.ok(collectionScript, `${route.lang}: CollectionPage JSON-LD missing`);
            const collection = JSON.parse(collectionScript[1]);
            const jsonLdLinks = (collection.mainEntity?.itemListElement || []).map((item) => item.url);
            assert.deepEqual(
              productLinks.map((link) => new URL(link, base).pathname + new URL(link, base).search),
              jsonLdLinks.map((link) => new URL(link, base).pathname + new URL(link, base).search),
              `${route.lang}: HTML card order must match CollectionPage ItemList`,
            );

            if (route.lang !== 'bg') {
              assert.ok(productLinks.every((link) => new URL(link, base).searchParams.get('lang') === route.lang),
                `${route.lang}: every product link must retain the locale`);
            }
            console.log(`PASS ${route.lang}: first HTTP response contains ${productLinks.length} equipment cards; JSON-LD order matches`);
          }
          NODE
